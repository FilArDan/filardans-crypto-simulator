<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Simulator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ── ЛОГИН ──────────────────────────────────────────────────────────────── -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">₿ CryptoSim</div>
    <form id="loginForm">
      <div class="field">
        <label>Имя игрока</label>
        <input id="usernameInput" type="text" autocomplete="username" required placeholder="Артур">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required placeholder="••••">
      </div>
      <div id="loginError" class="err"></div>
      <button type="submit" class="btn-primary">Войти</button>
    </form>
  </div>
</div>

<!-- ── ПРИЛОЖЕНИЕ ──────────────────────────────────────────────────────────── -->
<div id="appScreen" class="hidden">

  <!-- Шапка -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">₿ CryptoSim</span>
      <span id="playerName" class="player-tag"></span>
    </div>
    <div class="header-right">
      <button id="themeBtn" class="icon-btn">🌙</button>
      <button id="logoutBtn" class="btn-ghost">Выйти</button>
    </div>
  </header>

  <!-- Тикер -->
  <div id="ticker" class="ticker"></div>

  <!-- Основная сетка -->
  <div class="main-grid">

    <!-- Левая колонка -->
    <div class="col-left">

      <!-- Кошелёк -->
      <section class="card">
        <div class="card-title">💼 Портфель</div>
        <div class="stats-row">
          <div class="stat"><div class="stat-label">Итого</div><div id="sTotal" class="stat-val">—</div></div>
          <div class="stat"><div class="stat-label">Монеты</div><div id="sPort" class="stat-val">—</div></div>
          <div class="stat"><div class="stat-label">USD</div><div id="sCash" class="stat-val">—</div></div>
          <div class="stat"><div class="stat-label">Долг</div><div id="sDebt" class="stat-val">—</div></div>
        </div>
        <table class="port-table">
          <thead><tr><th>Монета</th><th>Кол-во</th><th>Цена</th><th>Стоимость</th></tr></thead>
          <tbody id="portfolioBody"></tbody>
        </table>
      </section>

      <!-- Торговля -->
      <section class="card">
        <div class="card-title">📈 Торговля</div>
        <form id="tradeForm">
          <div class="trade-row">
            <select id="tradeAsset"></select>
            <select id="tradeType">
              <option value="buy">Купить</option>
              <option value="sell">Продать</option>
            </select>
          </div>
          <div class="trade-mode-row">
            <button type="button" class="trade-mode-btn active" data-mode="qty">Кол-во</button>
            <button type="button" class="trade-mode-btn" data-mode="usd">USD</button>
          </div>
          <div id="fieldQty" class="field">
            <input id="tradeAmount" type="number" step="any" min="0" placeholder="Количество монет">
          </div>
          <div id="fieldUsd" class="field hidden">
            <input id="tradeUsd" type="number" step="any" min="0" placeholder="Сумма в USD">
          </div>
          <div id="tradeHint" class="hint"></div>
          <div id="tradeError" class="err"></div>
          <div class="trade-btns">
            <button type="submit" class="btn-primary">Торговать</button>
            <button type="button" id="buyAllBtn" class="btn-ghost">Купить всё</button>
            <button type="button" id="sellAllBtn" class="btn-ghost">Продать всё</button>
          </div>
        </form>
      </section>

      <!-- Перевод -->
      <section class="card">
        <div class="card-title">💸 Перевод</div>
        <form id="transferForm">
          <div class="field">
            <label>Получатель</label>
            <select id="transferTarget"></select>
          </div>
          <div class="field">
            <label>Сумма USD</label>
            <input id="transferAmount" type="number" step="any" min="0.01" placeholder="100">
          </div>
          <div id="transferError" class="err"></div>
          <button type="submit" class="btn-primary">Перевести</button>
        </form>
      </section>

      <!-- Кредит -->
      <section class="card">
        <div class="card-title">🏦 Кредит</div>
        <div id="loanError" class="err"></div>

        <!-- Активный кредит -->
        <div id="loanActivePanel" style="display:none">
          <div class="loan-info-row">
            <span class="loan-info-label">Долг:</span>
            <span id="loanDueDisplay" class="loan-info-val">—</span>
          </div>
          <div class="loan-info-row">
            <span class="loan-info-label">Ставка:</span>
            <span id="loanRateDisplay" class="loan-info-val">—</span>
          </div>
          <div class="margin-bar-wrap">
            <div id="marginBarFill" class="margin-bar-fill"></div>
          </div>
          <div id="marginLabel" class="hint"></div>
          <div class="field" style="margin-top:8px">
            <label>Погасить (оставь пустым — полностью)</label>
            <input id="repayAmount" type="number" step="any" min="0.01" placeholder="Сумма или пусто">
          </div>
          <button id="repayBtn" class="btn-primary">Погасить</button>
        </div>

        <!-- Форма нового кредита -->
        <div id="loanNewPanel">
          <p id="loanRateNote" class="hint" style="margin-bottom:6px"></p>
          <form id="loanForm">
            <div class="field">
              <label>Сумма кредита</label>
              <input id="loanAmount" type="number" step="any" min="100" placeholder="до $0">
              <!-- Прогресс-бар лимита -->
              <div id="loanLimitBar" class="loan-limit-bar" style="display:none">
                <div id="loanLimitFill" class="loan-limit-fill"></div>
              </div>
              <div id="loanLimitLabel" class="hint" style="margin-top:4px"></div>
            </div>
            <button type="submit" class="btn-primary">Взять кредит</button>
          </form>
        </div>
      </section>

    </div><!-- /col-left -->

    <!-- Правая колонка -->
    <div class="col-right">

      <!-- График -->
      <section class="card">
        <div class="card-title">📊 График цен</div>
        <div class="chart-controls">
          <div id="chartLegend" class="chart-legend"></div>
        </div>
        <canvas id="priceChart"></canvas>
      </section>

      <!-- Лидерборд -->
      <section class="card">
        <div class="card-title">🏆 Рейтинг</div>
        <table class="leader-table">
          <thead><tr><th>#</th><th>Игрок</th><th>Капитал</th><th></th></tr></thead>
          <tbody id="leaderBody"></tbody>
        </table>
      </section>

      <!-- Лента событий -->
      <section class="card">
        <div class="card-title">📋 Лента событий</div>
        <div id="activityFeed" class="feed"></div>
      </section>

    </div><!-- /col-right -->

  </div><!-- /main-grid -->
</div><!-- /appScreen -->

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
