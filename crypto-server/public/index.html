<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CryptoSim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <svg class="logo-icon" viewBox="0 0 44 44" fill="none">
        <circle cx="22" cy="22" r="22" fill="var(--pri)" opacity=".15"/>
        <path d="M22 10v4M22 30v4M10 22h4M30 22h4" stroke="var(--pri)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="22" cy="22" r="8" stroke="var(--pri)" stroke-width="2.5"/>
        <circle cx="22" cy="22" r="3" fill="var(--pri)"/>
      </svg>
      <div><h1>CryptoSim</h1><div class="sub">Биржа будущего</div></div>
    </div>
    <form id="loginForm" class="stack">
      <label>Имя игрока
        <input id="usernameInput" type="text" placeholder="Артур" autocomplete="username" required>
      </label>
      <label>Пароль
        <input id="passwordInput" type="password" placeholder="••••" autocomplete="current-password" required>
      </label>
      <div id="loginError" class="err-msg"></div>
      <button class="btn btn-primary" type="submit">Войти</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="hidden app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="logo-row">
      <svg class="logo-icon" viewBox="0 0 44 44" fill="none">
        <circle cx="22" cy="22" r="22" fill="var(--pri)" opacity=".15"/>
        <path d="M22 10v4M22 30v4M10 22h4M30 22h4" stroke="var(--pri)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="22" cy="22" r="8" stroke="var(--pri)" stroke-width="2.5"/>
        <circle cx="22" cy="22" r="3" fill="var(--pri)"/>
      </svg>
      <div><h1>CryptoSim</h1><div class="sub">Биржа будущего</div></div>
    </div>
    <div class="topbar-right">
      <span id="playerName"></span>
      <button class="tbtn" id="themeBtn" title="Тема">🌙</button>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="lbl">Итого</div><div id="sTotal" class="val">—</div></div>
    <div class="stat"><div class="lbl">Монеты</div><div id="sPort" class="val">—</div></div>
    <div class="stat"><div class="lbl">USD</div><div id="sCash" class="val">—</div></div>
    <div class="stat"><div class="lbl">Долг</div><div id="sDebt" class="val">—</div></div>
  </div>

  <!-- Ticker -->
  <div class="ticker-wrap section-gap">
    <h2>📊 Текущие цены</h2>
    <div id="ticker" class="ticker"></div>
  </div>

  <!-- Chart + Leaderboard -->
  <div class="g2b section-gap">
    <div class="card">
      <h2>📈 График цен</h2>
      <!-- Табы монет -->
      <div id="chartLegend" class="tabs"></div>
      <!-- Полотно: фиксированная высота -->
      <div class="cw"><canvas id="priceChart"></canvas></div>
      <!-- Кнопки диапазона -->
      <div id="chartRanges" class="chart-ranges" style="margin-top:8px"></div>
      <div id="cinfo" style="font-size:12px;color:var(--mu);margin-top:4px;min-height:16px"></div>
    </div>
    <div class="card">
      <h2>🏆 Рейтинг</h2>
      <table class="leader-table">
        <thead><tr><th>#</th><th>Игрок</th><th>Капитал</th><th></th></tr></thead>
        <tbody id="leaderBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Main grid -->
  <div class="g2 section-gap">

    <!-- Left -->
    <div style="display:flex;flex-direction:column;gap:20px">

      <!-- Portfolio -->
      <div class="card">
        <h2>💼 Портфель</h2>
        <table>
          <thead><tr><th>Монета</th><th>Кол-во</th><th>Цена</th><th>Стоимость</th></tr></thead>
          <tbody id="portfolioBody"></tbody>
        </table>
      </div>

      <!-- Trade -->
      <div class="card">
        <h2>↔️ Торговля</h2>
        <form id="tradeForm" style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;gap:8px">
            <select id="tradeAsset" style="flex:1"></select>
            <select id="tradeType" style="flex:1">
              <option value="buy">🟢 Купить</option>
              <option value="sell">🔴 Продать</option>
            </select>
          </div>
          <div class="trade-mode-tabs">
            <button type="button" class="trade-mode-btn active" data-mode="qty">Кол-во</button>
            <button type="button" class="trade-mode-btn" data-mode="usd">USD</button>
          </div>
          <div id="fieldQty" class="fld">
            <input id="tradeAmount" type="number" step="any" min="0" placeholder="Количество монет">
          </div>
          <div id="fieldUsd" class="fld hidden">
            <input id="tradeUsd" type="number" step="any" min="0" placeholder="Сумма в USD">
          </div>
          <div id="tradeHint" style="font-size:12px;color:var(--mu);min-height:18px"></div>
          <div id="tradeError" class="err-msg"></div>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary btn-sm">Торговать</button>
            <button type="button" id="buyAllBtn" class="btn btn-secondary btn-sm">Всё USD</button>
            <button type="button" id="sellAllBtn" class="btn btn-secondary btn-sm">Все монеты</button>
          </div>
        </form>
      </div>

      <!-- Transfer -->
      <div class="card">
        <h2>💸 Перевод</h2>
        <form id="transferForm" style="display:flex;flex-direction:column;gap:10px">
          <div class="fld"><label class="lbl">Получатель</label><select id="transferTarget"></select></div>
          <div class="fld"><label class="lbl">Сумма USD</label><input id="transferAmount" type="number" step="any" min="0.01" placeholder="100"></div>
          <div id="transferError" class="err-msg"></div>
          <button type="submit" class="btn btn-primary btn-sm">Перевести</button>
        </form>
      </div>

      <!-- Loan -->
      <div class="card">
        <h2>🏦 Кредит</h2>
        <div id="loanError" class="err-msg"></div>
        <div id="loanActivePanel" style="display:none;">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
            <span style="color:var(--mu)">Долг</span>
            <span id="loanDueDisplay" style="font-weight:700"></span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px">
            <span style="color:var(--mu)">Ставка</span>
            <span id="loanRateDisplay" style="color:var(--warn)"></span>
          </div>
          <div style="height:8px;background:var(--sf2);border-radius:999px;overflow:hidden;margin-bottom:4px">
            <div id="marginBarFill" style="height:100%;width:0%;background:var(--pri);border-radius:999px;transition:width .4s,background .3s"></div>
          </div>
          <div id="marginLabel" style="font-size:12px;color:var(--mu);margin-bottom:12px"></div>
          <div class="fld" style="margin-bottom:8px">
            <label class="lbl">Частичное погашение (USD)</label>
            <input id="repayAmount" type="number" step="any" min="0.01" placeholder="Оставь пустым — полностью">
          </div>
          <button id="repayBtn" class="btn btn-primary btn-sm">Погасить</button>
        </div>
        <div id="loanNewPanel">
          <p id="loanRateNote" style="font-size:12px;color:var(--mu);margin-bottom:8px"></p>
          <form id="loanForm" style="display:flex;flex-direction:column;gap:8px">
            <div class="fld">
              <label class="lbl">Сумма кредита</label>
              <input id="loanAmount" type="number" step="any" min="100" placeholder="до $0">
              <div id="loanLimitBar" style="display:none;height:6px;background:var(--sf2);border-radius:999px;overflow:hidden;margin-top:6px">
                <div id="loanLimitFill" style="height:100%;width:0%;background:var(--pri);border-radius:999px;transition:width .2s,background .2s"></div>
              </div>
              <div id="loanLimitLabel" style="font-size:12px;margin-top:4px;color:var(--mu)"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Взять кредит</button>
          </form>
        </div>
      </div>

    </div>

    <!-- Right -->
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="card">
        <h2>📋 Лента событий</h2>
        <div id="activityFeed" class="feed"></div>
      </div>
    </div>

  </div><!-- /g2 -->

</div><!-- /appScreen -->

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
